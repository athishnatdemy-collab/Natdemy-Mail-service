<!DOCTYPE html>

<html>
<head>
    <title>Create Employee Email</title>
    <!-- use a clean sans-serif font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            width: 90%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 1rem;
        }

        .logo img {
            max-width: 100px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            margin: 0.25rem 0 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
        }

        .input-with-suffix {
            position: relative;
            width: 100%;
        }

        /* ensure padding is included in width calculation */
        .input-with-suffix input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 120px; /* plenty of room for the domain text */
        }

        .input-with-suffix .suffix {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            pointer-events: none;
            white-space: nowrap;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn:active {
            background-color: #00408d;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            .btn {
                padding: 0.6rem;
                font-size: 0.9rem;
            }
        }

        .message {
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 6px;
        }

        .message.success {
            background: #e6ffed;
            color: #2d7a46;
        }

        .message.error {
            background: #ffe6e6;
            color: #a12b2b;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            button {
                padding: 0.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
        <div class="logo">
            <!-- replace with actual logo if available -->
            <!-- <img src="/static/logo.png" alt="Company logo"> -->
        </div>
        <h2>Create Company Email</h2>

        <form method="post" class="email-form">
            {% csrf_token %}
    <label>Employee Name</label><br>
    <input type="text" name="name" required><br><br>

    <label>Email Username</label><br>
    <div class="input-with-suffix">
        <input type="text" name="email" placeholder="rahul" required>
        <span class="suffix">@natdemy.in</span>
    </div>
    <br><br>

    <label>Password</label><br>
    <input type="password" name="password" required><br><br>

    <label>Mailbox Quota (MB)</label><br>
    <input type="number" name="quota" value="500"><br><br>

    <label>Admin Password</label><br>
    <input type="password" name="admin_password" placeholder="Enter admin password" required><br><br>

    <button type="submit" class="btn">Create Email</button>

        </form>

        {% if message %}
            {% if 'created successfully' in message %}
                <div class="message success" id="messageBox">
                    {{ message }}
                </div>
            {% else %}
                <div class="message error" id="messageBox">
                    {{ message }}
                </div>
            {% endif %}
        {% endif %}
    </div>

    <script>
        // Auto-hide message after 5 seconds
        const messageBox = document.getElementById('messageBox');
        if (messageBox) {
            setTimeout(() => {
                messageBox.style.opacity = '0';
                messageBox.style.transition = 'opacity 0.3s ease-out';
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 300);
            }, 5000); // 5000ms = 5 seconds
        }
    </script>

</body>
</html>
